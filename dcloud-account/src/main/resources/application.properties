# 设置服务器端口为8080
server.port=8080
# 设置Spring应用名称为account-service
spring.application.name=account-service
# 设置Nacos发现服务的地址为192.168.213.100:8848
spring.cloud.nacos.discovery.server-addr=192.168.213.100:8848

# 设置数据源驱动类名为com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 设置数据源用户名为root
spring.datasource.username=root
# 设置数据源密码为123456
spring.datasource.password=123456
# 设置数据源URL为指定的MySQL数据库地址和参数
spring.datasource.url=jdbc:mysql://192.168.213.100:3306/test_account?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai

# 设置MyBatis-Plus日志实现类为StdOutImpl
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 设置Redis主机地址为192.168.213.100
spring.data.redis.host=192.168.213.100
# 设置Redis密码
spring.data.redis.password=123456
# 设置Redis端口为
spring.data.redis.port=6379

############## Sa-Token 配置 ##############

# 设置token名称为satoken
sa-token.token-name=satoken
# 设置token有效期为2592000秒（30天）
sa-token.timeout=2592000
# 设置token活跃有效期为-1，表示永不过期
sa-token.active-timeout=-1
# 设置是否允许并发登录为true
sa-token.is-concurrent=true
# 设置是否共享token为true
sa-token.is-share=true
# 设置token风格为uuid
sa-token.token-style=uuid
# 设置是否开启token日志记录为true
sa-token.is-log=true
