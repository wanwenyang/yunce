# 设置服务器端口为8000
server.port=8000
# 设置Spring应用的名称为gateway-service
spring.application.name=gateway-service
# 配置Nacos发现服务的服务器地址
spring.cloud.nacos.discovery.server-addr=192.168.213.100:8848

# 配置数据源的驱动类名为com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 设置数据库用户名
spring.datasource.username=root
# 设置数据库密码
spring.datasource.password=xdclass.net168
# 配置数据库连接URL
spring.datasource.url=jdbc:mysql://192.168.213.100:3306/test_account?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai

# 配置MyBatis-Plus的日志实现类
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 设置Redis主机地址
spring.data.redis.host=192.168.213.100
# 设置Redis密码
spring.data.redis.password=123456abc
# 设置Redis端口
spring.data.redis.port=6379

# 配置Sa-Token的相关参数
sa-token.token-name=satoken
sa-token.timeout=2592000
sa-token.active-timeout=-1
sa-token.is-concurrent=true
sa-token.is-share=true
sa-token.token-style=uuid
sa-token.is-log=true


# 以下为Spring Cloud Gateway的路由配置
# 配置第一个路由，ID为account-service
spring.cloud.gateway.routes[0].id=account-service
# 路由目标地址为负载均衡的account-service服务
spring.cloud.gateway.routes[0].uri=lb://account-service
# 路由的匹配条件为路径以/account-service/**开头
spring.cloud.gateway.routes[0].predicates[0]=Path=/account-service/**
# 过滤器配置，移除请求路径的第一个路径段
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# 配置第二个路由，ID为engine-service
spring.cloud.gateway.routes[1].id=engine-service
# 路由目标地址为负载均衡的engine-service服务
spring.cloud.gateway.routes[1].uri=lb://engine-service
# 路由的匹配条件为路径以/engine-service/**开头
spring.cloud.gateway.routes[1].predicates[0]=Path=/engine-service/**
# 过滤器配置，移除请求路径的第一个路径段
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# 配置第三个路由，ID为data-service
spring.cloud.gateway.routes[2].id=data-service
# 路由目标地址为负载均衡的data-service服务
spring.cloud.gateway.routes[2].uri=lb://data-service
# 路由的匹配条件为路径以/data-service/**开头
spring.cloud.gateway.routes[2].predicates[0]=Path=/data-service/**
# 过滤器配置，移除请求路径的第一个路径段
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

